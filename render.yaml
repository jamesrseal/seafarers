services:
  - type: web
    name: seafarers
    runtime: node
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install
    startCommand: bash start.sh
    envVars:
      - key: NODE_ENV
        value: production
      # No persistent disk (free plan): /data is wiped on every restart, and
      # start.sh copies the committed backend/data/seafarers.db there on start.
      - key: DATABASE_PATH
        value: /data/seafarers.db
      # Shared secret for POST /api/scrapes/ingest on the live site; production
      # refuses ingest when it's unset. The daily refresh ingests on the runner.
      - key: INGEST_TOKEN
        sync: false
